name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,gemini]"
      - name: Unit and integration tests
        run: pytest -q
      - name: Build index from the committed sample
        run: takam-ingest build
      - name: Retrieval quality gate
        run: takam-eval --k 5 --min-recall 0.9

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t takam-search:${{ github.sha }} .
      - name: Smoke test the image (deployment verification)
        run: |
          docker run -d --name app -p 8000:8000 takam-search:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/health | tee health.json
          # Golden query: must find instruction 1.3.1 (the site's own search returns nothing).
          curl -fs -G http://127.0.0.1:8000/search --data-urlencode "q=חתימה דיגיטלית" \
            | python -c "import json,sys; h=json.load(sys.stdin)['hits']; assert h and h[0]['doc_code']=='H.1.3.1', h; print('golden query ok')"
      - if: failure()
        run: docker logs app
