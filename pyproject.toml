[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takam-search"
version = "0.1.0"
description = "Full-text search and cited Q&A over Israeli government accounting instructions (takam.mof.gov.il) - POC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-docx>=1.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langchain>=1.0",
]

[project.optional-dependencies]
# LLM provider integrations (pick one; the default config uses Gemini).
gemini = ["langchain-google-genai>=2.0"]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
takam-ingest = "takam_search.ingest:main"
takam-eval = "takam_search.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
